<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Counter</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #fff;
    }

    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 500;
    }

    .multiplier-label {
      margin: 1.5rem 0 0.5rem;
      font-size: 0.85rem;
      opacity: 0.85;
      letter-spacing: 0.03em;
    }

    .multipliers {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .multipliers button {
      padding: 0.5rem 0.9rem;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.85);
      color: #2575fc;
    }

    .multipliers button.active {
      background: #2575fc;
      color: #fff;
    }

    .count {
      font-size: 5rem;
      font-weight: 700;
      margin: 1rem 0 2rem;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .per-click {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 1.25rem;
    }

    #clickBtn {
      border: none;
      border-radius: 0.75rem;
      padding: 1rem 2.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: #2575fc;
      background: #fff;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    #clickBtn:hover {
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    #clickBtn:active {
      transform: scale(0.94);
    }

    .reset {
      margin-top: 1.5rem;
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 0.5rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: none;
      border-radius: 0.75rem;
      cursor: pointer;
    }

    .reset:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Click Counter</h1>
    <div class="multiplier-label">Multiplier per click</div>
    <div class="multipliers" id="multipliers"></div>
    <div class="count" id="count">0</div>
    <div class="per-click">+<span id="perClick">1</span> per click</div>
    <button id="clickBtn">Click me</button>
    <br />
    <button class="reset" id="resetBtn">Reset</button>
  </div>

  <script>
    const countEl = document.getElementById('count');
    const perClickEl = document.getElementById('perClick');
    const clickBtn = document.getElementById('clickBtn');
    const resetBtn = document.getElementById('resetBtn');
    const multipliersEl = document.getElementById('multipliers');

    const multiplierValues = [1, 2, 5, 10, 25, 50, 100, 500, 1000];
    let count = 0;
    let multiplier = 1;

    multiplierValues.forEach((value) => {
      const btn = document.createElement('button');
      btn.textContent = value + 'x';
      btn.dataset.multiplier = value;
      if (value === 1) btn.classList.add('active');
      btn.addEventListener('click', () => {
        multiplier = value;
        perClickEl.textContent = multiplier;
        [...multipliersEl.children].forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      });
      multipliersEl.appendChild(btn);
    });

    clickBtn.addEventListener('click', () => {
      count += multiplier;
      countEl.textContent = count.toLocaleString();
    });

    resetBtn.addEventListener('click', () => {
      count = 0;
      countEl.textContent = count.toLocaleString();
    });
  </script>
</body>
</html>
